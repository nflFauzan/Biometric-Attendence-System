spring.application.name=backend

# Database: nilai diambil dari environment (lihat .env.example di root repo).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/absensi}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema hanya diubah lewat migration Flyway (src/main/resources/db/migration).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health
