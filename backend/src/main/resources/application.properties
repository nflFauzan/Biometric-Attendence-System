spring.application.name=backend

# Database: nilai diambil dari environment (lihat .env.example di root repo).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/absensi}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema hanya diubah lewat migration Flyway (src/main/resources/db/migration).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Sengaja TIDAK memakai hibernate.jdbc.time_zone (K-069): properti itu menggeser kolom TIME/TIMESTAMP tanpa
# zona (jam aturan kerja, jam koreksi, jam lokal mesin) sebesar selisih zona JVM, sehingga 08:00 tersimpan 01:00.
# Kolom TIMESTAMPTZ (Instant) tetap disimpan dalam UTC oleh Hibernate.

management.endpoints.web.exposure.include=health

# Sesi login disimpan di database (tabel dibuat lewat Flyway V2).
spring.session.jdbc.initialize-schema=never
# Sesi 8 jam (K-014). spring.session.timeout yang dipakai Spring Session JDBC; tanpa ini sesi
# tersimpan dengan default 30 menit (diverifikasi oleh SessionRevocationTests.sessionTimeoutIsEightHours).
spring.session.timeout=8h
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Wajib true di production (HTTPS). Default false agar development lewat http://localhost tetap bisa login.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Backend berjalan di belakang nginx/reverse proxy: hormati X-Forwarded-* (skema https, IP klien).
server.forward-headers-strategy=native

# Dokumentasi API (OpenAPI/Swagger UI). Mati secara default; nyalakan hanya di development dengan
# OPENAPI_ENABLED=true. Saat menyala tetap wajib login sebagai Owner atau HR/Finance (SecurityConfig).
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.csrf.enabled=true
springdoc.paths-to-match=/api/**

# Zona waktu perusahaan untuk menentukan "hari ini", mis. kapan versi aturan kerja terkunci (K-050).
# Zona waktu per cabang tetap diambil dari data cabang.
app.company-timezone=${COMPANY_TIMEZONE:Asia/Jakarta}

# Mesin dianggap offline bila tidak ada kontak selama durasi ini (K-064). Parameter teknis, bukan aturan bisnis.
app.device.offline-after=${DEVICE_OFFLINE_AFTER:5m}
# Port kedua untuk mesin saat backend jalan di luar Docker, mis. 8888 dari start-dev.bat (K-086). Kosong = tidak ada.
app.device.extra-port=${DEVICE_EXTRA_PORT:}
# Alamat server bawaan di kode pengaturan alat rakitan, mis. http://192.168.43.20:8888 (K-099). Kosong = browser
# memakai http://<alamat web>:8888. Hanya isian awal; admin tetap bisa mengubahnya sebelum menyalin kode.
app.device.public-url=${DEVICE_PUBLIC_URL:}
# Batas waktu pendaftaran sidik jari (K-094). Parameter teknis, bukan aturan bisnis: perintah yang tidak diambil
# mesin kedaluwarsa; mesin menunggu jari maksimal machine-timeout; tanpa hasil sampai result-timeout = gagal.
app.device.enroll.pickup-timeout=30s
app.device.enroll.machine-timeout=60s
app.device.enroll.result-timeout=75s
# Seberapa sering batas waktu perintah diperiksa, dan berapa lama pembatalan tetap diberitahukan ke mesin.
app.device.command-sweep=5s
app.device.cancel-notice=2m
# Peringatan "kapasitas sensor hampir penuh" saat isi sensor alat rakitan melewati persen ini (spec §17.9).
app.device.sensor-warning-percent=90
# Pemeriksaan tanggal keluar untuk penghapusan sidik jari (spec §17.4); parameter teknis.
app.fingerprint.departure-check=1h
# Scan yang waktunya lebih jauh dari ini di depan waktu server diberi penanda WAKTU_DI_MASA_DEPAN (K-065).
app.scan.future-tolerance=${SCAN_FUTURE_TOLERANCE:5m}

# Surat pendukung izin/cuti (K-078): disimpan di folder ini (di Docker: volume "uploads"). Batas 5 MB per file
# juga diperiksa di AttachmentStorage; batas request sedikit lebih besar untuk overhead multipart.
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Akun Owner pertama dibuat otomatis jika belum ada Owner (lihat .env.example).
app.bootstrap.owner-username=${OWNER_USERNAME:}
app.bootstrap.owner-password=${OWNER_INITIAL_PASSWORD:}
