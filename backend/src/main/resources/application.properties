spring.application.name=backend

# Database: nilai diambil dari environment (lihat .env.example di root repo).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/absensi}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema hanya diubah lewat migration Flyway (src/main/resources/db/migration).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health

# Sesi login disimpan di database (tabel dibuat lewat Flyway V2).
spring.session.jdbc.initialize-schema=never
# Sesi 8 jam (K-014). spring.session.timeout yang dipakai Spring Session JDBC; tanpa ini sesi
# tersimpan dengan default 30 menit (diverifikasi oleh SessionRevocationTests.sessionTimeoutIsEightHours).
spring.session.timeout=8h
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Wajib true di production (HTTPS). Default false agar development lewat http://localhost tetap bisa login.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Backend berjalan di belakang nginx/reverse proxy: hormati X-Forwarded-* (skema https, IP klien).
server.forward-headers-strategy=native

# Dokumentasi API (OpenAPI/Swagger UI). Mati secara default; nyalakan hanya di development dengan
# OPENAPI_ENABLED=true. Saat menyala tetap wajib login sebagai Owner atau HR/Finance (SecurityConfig).
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.csrf.enabled=true
springdoc.paths-to-match=/api/**

# Akun Owner pertama dibuat otomatis jika belum ada Owner (lihat .env.example).
app.bootstrap.owner-username=${OWNER_USERNAME:}
app.bootstrap.owner-password=${OWNER_INITIAL_PASSWORD:}
