# Pipeline CI (DSN-001 v0.6 F-5, K-144): setiap push dan pull request ke main menjalankan seluruh test otomatis,
# termasuk test case TC-xx dari docs/aturan-bisnis.md dan matriks hak akses (AccessControlTests).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21, Maven, Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers memakai Docker yang sudah tersedia di runner ubuntu-latest.
      - name: Test
        run: sh ./mvnw -B -ntp verify

  frontend:
    name: Frontend (Node 24, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker Compose (konfigurasi dan build image)
    runs-on: ubuntu-latest
    env:
      DB_NAME: absensi
      DB_USERNAME: ci
      DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - name: Validasi docker-compose.yml
        run: docker compose config --quiet
      - name: Build image
        run: docker compose build
