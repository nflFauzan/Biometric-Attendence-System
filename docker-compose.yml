# Menjalankan seluruh sistem: docker compose up --build
# Hanya database (untuk development lokal): docker compose up db
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Hanya dari server itu sendiri (K-144): database tidak boleh terjangkau dari jaringan.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      OWNER_USERNAME: ${OWNER_USERNAME}
      OWNER_INITIAL_PASSWORD: ${OWNER_INITIAL_PASSWORD}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      DEVICE_OFFLINE_AFTER: ${DEVICE_OFFLINE_AFTER:-5m}
      DEVICE_PUBLIC_URL: ${DEVICE_PUBLIC_URL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      # Surat pendukung izin/cuti (K-078). Volume ini harus ikut dicadangkan bersama database.
      UPLOADS_DIR: /app/uploads
      TZ: Asia/Jakarta
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # Backend tidak dipublikasikan ke jaringan (K-144): browser lewat nginx port WEB_PORT, mesin lewat nginx port
    # DEVICE_PORT. Port 8080 hanya terbuka untuk server itu sendiri (diagnosis, Swagger saat OPENAPI_ENABLED=true).
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Di laptop yang sibuk backend pernah butuh ±3 menit untuk start.
      start_period: 180s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
      # Port untuk mesin absensi (K-060: keypad mesin uji X401 tidak bisa mengetik angka 0). Nginx hanya meneruskan
      # /device/ dan /iclock/ ke backend (K-144).
      - "${DEVICE_PORT:-8888}:8888"

volumes:
  db_data:
  uploads:
