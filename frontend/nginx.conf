server {
    listen 80;
    root /usr/share/nginx/html;

    # Pemberitahuan real-time dashboard (SSE): jangan di-buffer agar event langsung sampai ke browser.
    location = /api/dashboard/stream {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Request API diteruskan ke container backend.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
    }

    # Single-page app: semua route lain dilayani index.html.
    location / {
        try_files $uri /index.html;
    }
}
