# Pintu masuk mesin absensi (K-060, K-144; DSN-001 v0.6 F-1/F-2). Mesin tidak lagi langsung ke backend: hanya
# protokol mesin yang diteruskan, sehingga /api, /actuator, dan Swagger tidak bisa diakses lewat port mesin.
server {
    listen 8888;

    # Alat rakitan (docs/protokol-alat-rakitan.md). Batch maksimal 200 scan jauh di bawah 1 MB.
    location /device/ {
        client_max_body_size 1m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Ditimpa (bukan ditambah) agar mesin tidak bisa memalsukan IP lewat header X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mesin komersial ADMS (/iclock), hanya untuk mesin uji (C-15). Unggahan log bisa berisi banyak baris.
    location /iclock/ {
        client_max_body_size 10m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Pemberitahuan real-time dashboard (SSE): jangan di-buffer agar event langsung sampai ke browser.
    location = /api/dashboard/stream {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Request API diteruskan ke container backend. Batas body 6 MB untuk unggah surat izin (maks. 5 MB per file,
    # K-078); bawaan nginx hanya 1 MB sehingga surat yang lebih besar akan ditolak sebelum sampai ke backend.
    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
    }

    # File hasil build bernama ber-hash, jadi aman di-cache lama.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: semua route lain dilayani index.html. index.html selalu dicek ulang agar browser
    # langsung memakai versi baru setelah update (tanpa ini browser bisa terus menjalankan bundle lama).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
